<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nexus Games - Catálogo</title>
	<link rel="stylesheet" href="../css/catalogo.css">
</head>
<body>
	<main class="catalogo">
		<header class="topbar">
			<a class="brand" href="principal.html">

			<label class="search">
				<span>⌕</span>
				<input type="search" placeholder="Buscar juegos...">
			</label>

			<a class="account" href="login.html">Mi Cuenta</a>
		</header>

		<section class="catalog-header">
			<h1>Catálogo de juegos</h1>
			<p>Encuentra y compra tus juegos favoritos al mejor precio. Disfruta de las mejores ofertas en videojuegos.</p>
		</section>

		<section class="games" aria-label="Lista de juegos">
			<article class="game-card">
				<img src="https://tse4.mm.bing.net/th/id/OIP.NZ53080KQK6_O7wTDRTFxwHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Cyberpunk 2077">
				<div class="game-info"><small>RPG / Acción</small><h2>Cyberpunk 2077</h2><strong>$29.99</strong><button>Ver detalles</button></div>
			</article>
		</section>

		<nav class="pagination" aria-label="Paginación del catálogo">
			<a href="#" aria-label="Página anterior">‹</a>
			<a class="active" href="#">1</a>
			<a href="#">2</a>

</html>
