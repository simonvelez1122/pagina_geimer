<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nexus Games - Resultados de búsqueda</title>
	<link rel="stylesheet" href="../css/Busqueda.css">
</head>
<body>
	<main class="search-page">
		<header class="topbar">
			<a class="brand" href="principal.html" aria-label="Nexus Games, inicio">
				<img src="https://play-lh.googleusercontent.com/cyRQ4zDZ8dNnnCb-hkenWA00Dp96eNhk5L8EfdTC_myJy1bjIyTAz5hV0eXoYYVdTXaCXYVQo_CK0kpgZ4HtPu4" alt="" class="brand-mark">
				<span>NEXUS GAMES</span>
			</a>
			<a class="account" href="login.html">Mi Cuenta</a>
		</header>

		<section class="results" aria-labelledby="results-title">
			<p class="eyebrow">RESULTADOS DE LA BÚSQUEDA</p>
			<h1 id="results-title">Mostrando resultados para "Cyberpunk 2077"</h1>

			<label class="search-box">
				<span aria-hidden="true">⌕</span>
				<input type="search" value="Cyberpunk 2077" aria-label="Buscar juegos">
				<span class="shortcut" aria-hidden="true">⌘</span>
			</label>

			<article class="result-card">
				<img class="game-cover" src="https://tse4.mm.bing.net/th/id/OIP.NZ53080KQK6_O7wTDRTFxwHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Portada de Cyberpunk 2077">
				<div class="game-details">
					<span class="tag">RPG</span>
					<h2>Cyberpunk 2077</h2>
					<p>Comparación de precios</p>
					<div class="stores">
						<div class="store">
							<span class="store-name">Tienda <b class="dot green"></b> Disponible</span>
							<strong>$59.99 USD</strong>
							<a href="#comprar" class="buy">Comprar</a>
						</div>
						<div class="store">
							<span class="store-name">Tienda <b class="dot green"></b> Disponible</span>
							<strong>$49.99 USD</strong>
							<a href="#comprar" class="buy">Comprar</a>
						</div>
						<div class="store unavailable">
							<span class="store-name">Tienda <b class="dot red"></b> No disponible</span>
							<strong>Sin stock</strong>
							<button type="button" disabled>Sin existencias</button>
						</div>
					</div>
				</div>
			</article>
		</section>
	</main>
</body>
</html>
