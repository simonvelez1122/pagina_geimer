<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS GAMES - Iniciar sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <main class="card">
        <header class="header">
            <div class="brand">
                <div class="logo-box">
                    <img src="https://play-lh.googleusercontent.com/cyRQ4zDZ8dNnnCb-hkenWA00Dp96eNhk5L8EfdTC_myJy1bjIyTAz5hV0eXoYYVdTXaCXYVQo_CK0kpgZ4HtPu4" alt="Mando de videojuegos">
                </div>
                <span>NEXUS GAMES</span>
            </div>
            <a class="close-btn" href="principal.html" aria-label="Volver al inicio">
                <i class="fa-solid fa-xmark"></i>
            </a>
        </header>

        <nav class="tabs" aria-label="Navegación de cuenta">
            <a class="tab active" href="login.html">
                <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
            </a>
            <a class="tab" href="register.html">
                <i class="fa-solid fa-user-plus"></i> Registrarse
            </a>
        </nav>

        <h1>Bienvenido de vuelta</h1>
        <p class="subtitle">Accede a tu cuenta Nexus Games</p>

        <form id="loginForm" novalidate>
            <div class="input-group">
                <label for="email">CORREO ELECTRÓNICO</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" placeholder="tu@correo.com">
                </div>
            </div>

            <div class="input-group password-group">
                <label for="password">CONTRASEÑA</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••">
                </div>
            </div>

            <button class="submit-btn" type="submit">INICIAR SESIÓN</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../JS/login.js"></script>
</body>
</html>
